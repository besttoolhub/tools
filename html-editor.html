<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Edit HTML and CSS with a live preview, open local HTML files, and export your work in your browser.">
  <title>HTML Editor &amp; Viewer | Tool Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      height: 100vh;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
      background: #18181b;
      color: #f4f4f5;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    button, select, input { font: inherit; }
    button, select {
      min-height: 34px;
      padding: 5px 10px;
      border: 1px solid #52525b;
      border-radius: 5px;
      background: #3f3f46;
      color: #f4f4f5;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover, select:hover { background: #52525b; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .resizer:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
    .toolbar {
      display: flex;
      flex: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #3f3f46;
      background: #27272a;
    }
    .brand { margin-right: 8px; color: #38bdf8; font-size: 15px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
    .toolbar-actions { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 7px; }
    button.primary { border-color: #0369a1; background: #0284c7; font-weight: 600; }
    button.primary:hover { background: #0369a1; }
    .divider { width: 1px; height: 22px; margin: 0 3px; background: #52525b; }
    .color-control { display: inline-flex; align-items: center; gap: 6px; color: #d4d4d8; font-size: 12px; white-space: nowrap; }
    input[type="color"] { width: 32px; height: 30px; padding: 2px; border: 1px solid #52525b; border-radius: 5px; background: #3f3f46; cursor: pointer; }
    .spacer { flex: 1; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; }
    .workspace { display: flex; flex: 1; min-height: 0; }
    .pane { display: flex; min-width: 0; flex: 1; flex-direction: column; }
    #leftPane { flex-basis: 50%; }
    .pane-header {
      display: flex;
      flex: none;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 12px;
      border-bottom: 1px solid #3f3f46;
      background: #202023;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .7px;
    }
    .pane-header span:last-child { color: #a1a1aa; font-weight: 500; letter-spacing: 0; }
    #codeEditor {
      width: 100%;
      flex: 1;
      padding: 14px;
      border: 0;
      outline: 0;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      tab-size: 2;
    }
    .resizer {
      z-index: 1;
      width: 6px;
      flex: none;
      background: #3f3f46;
      cursor: col-resize;
      touch-action: none;
    }
    .resizer:hover, .resizer:focus-visible { background: #38bdf8; }
    .preview-wrapper { display: flex; flex: 1; justify-content: center; overflow: auto; background: #e4e4e7; }
    #previewFrame { width: 100%; height: 100%; flex: none; border: 0; background: #fff; }
    @media (max-width: 850px) {
      .toolbar { align-items: flex-start; }
      .toolbar-actions { min-width: 0; }
      .spacer { display: none; }
    }
    @media (max-width: 560px) {
      .toolbar { max-height: 35vh; overflow-y: auto; }
      .brand { width: 100%; }
      .toolbar-actions { flex: auto; }
      .pane-header { padding: 7px; font-size: 9px; }
      #codeEditor { padding: 9px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <span class="brand">✦ WebDreamweaver</span>
    <div class="toolbar-actions">
      <button type="button" data-insert="heading">+ Heading</button>
      <button type="button" data-insert="paragraph">+ Paragraph</button>
      <button type="button" data-insert="link">+ Link</button>
      <button type="button" data-insert="image">+ Image</button>
      <button type="button" data-insert="card">+ Div Card</button>
      <span class="divider" aria-hidden="true"></span>
      <label class="color-control" for="colorPicker">Insert color:
        <input type="color" id="colorPicker" value="#0284c7">
      </label>
      <span class="spacer"></span>
      <label class="visually-hidden" for="viewportSelect">Preview width</label>
      <select id="viewportSelect" title="Preview screen size">
        <option value="100%">Desktop (100%)</option>
        <option value="768px">Tablet (768px)</option>
        <option value="375px">Mobile (375px)</option>
      </select>
      <button type="button" id="openFile">Open HTML</button>
      <button type="button" class="primary" id="exportFile">Export .html</button>
      <input type="file" id="fileInput" accept=".html,.htm,.dwt,text/html" hidden>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <section class="pane" id="leftPane" aria-label="HTML code editor">
      <div class="pane-header"><span>CODE VIEW (HTML / CSS / JS)</span><span>Auto-sync on</span></div>
      <textarea id="codeEditor" aria-label="HTML source code" spellcheck="false" autocapitalize="off"></textarea>
    </section>
    <div class="resizer" id="resizer" role="separator" aria-label="Resize editor and preview panes" aria-orientation="vertical" aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" tabindex="0"></div>
    <section class="pane" id="rightPane" aria-label="Live design preview">
      <div class="pane-header"><span>LIVE DESIGN VIEW</span><span id="sizeLabel">100%</span></div>
      <div class="preview-wrapper">
        <iframe id="previewFrame" title="HTML live preview" sandbox="allow-scripts"></iframe>
      </div>
    </section>
  </main>
  <script>
    const editor = document.getElementById('codeEditor');
    const preview = document.getElementById('previewFrame');
    const fileInput = document.getElementById('fileInput');
    const leftPane = document.getElementById('leftPane');
    const resizer = document.getElementById('resizer');

    const starterTemplate = `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Web Page</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #f8fafc; color: #1e293b; padding: 40px 20px; margin: 0; }
    .container { max-width: 720px; margin: auto; padding: 32px; border-radius: 12px; background: white; box-shadow: 0 10px 25px rgb(0 0 0 / 6%); }
    h1 { margin-top: 0; color: #0284c7; }
    .box { margin: 16px 0; padding: 16px; border-left: 4px solid #0284c7; border-radius: 6px; background: #f1f5f9; }
    .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; background: #0284c7; color: white; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Visual HTML &amp; CSS Studio</h1>
    <p>Edit the code here or use the toolbar to build your page.</p>
    <div class="box">
      <h2>Responsive preview</h2>
      <p>Choose a viewport size to check your layout.</p>
    </div>
    <a href="#" class="btn">Get Started</a>
  </div>
</body>
</html>`;

    const snippets = {
      heading: '<h2>New Section Heading</h2>\n',
      paragraph: '<p>Editable paragraph text goes here.</p>\n',
      link: '<a href="https://example.com" class="btn">Button Link</a>\n',
      image: '<img src="https://picsum.photos/400/200" alt="Sample" style="max-width:100%; border-radius:8px;">\n',
      card: '<div class="box">\n  <h3>Card Title</h3>\n  <p>Card content</p>\n</div>\n'
    };

    function updatePreview() {
      preview.srcdoc = editor.value;
    }

    function insertText(text) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.setRangeText(text, start, end, 'end');
      editor.focus();
      updatePreview();
    }

    function setPreviewWidth(width) {
      preview.style.width = width;
      document.getElementById('sizeLabel').textContent = width;
    }

    editor.value = starterTemplate;
    updatePreview();
    editor.addEventListener('input', updatePreview);
    editor.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab') return;
      event.preventDefault();
      insertText('  ');
    });

    document.querySelectorAll('[data-insert]').forEach((button) => {
      button.addEventListener('click', () => insertText(snippets[button.dataset.insert]));
    });
    document.getElementById('colorPicker').addEventListener('input', (event) => insertText(event.target.value));
    document.getElementById('viewportSelect').addEventListener('change', (event) => setPreviewWidth(event.target.value));
    document.getElementById('openFile').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        editor.value = await file.text();
        updatePreview();
      } catch (error) {
        window.alert(`Could not read the selected file: ${error.message}`);
      } finally {
        fileInput.value = '';
      }
    });
    document.getElementById('exportFile').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([editor.value], { type: 'text/html;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'index.html';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    function resizePanes(clientX) {
      const bounds = document.getElementById('workspace').getBoundingClientRect();
      const percentage = Math.min(85, Math.max(15, ((clientX - bounds.left) / bounds.width) * 100));
      leftPane.style.flex = `0 0 ${percentage}%`;
      resizer.setAttribute('aria-valuenow', String(Math.round(percentage)));
    }

    resizer.addEventListener('pointerdown', (event) => {
      resizer.setPointerCapture(event.pointerId);
      resizePanes(event.clientX);
    });
    resizer.addEventListener('pointermove', (event) => {
      if (resizer.hasPointerCapture(event.pointerId)) resizePanes(event.clientX);
    });
    resizer.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      event.preventDefault();
      const current = Number(resizer.getAttribute('aria-valuenow'));
      const change = event.key === 'ArrowLeft' ? -2 : 2;
      const bounds = document.getElementById('workspace').getBoundingClientRect();
      resizePanes(bounds.left + (Math.min(85, Math.max(15, current + change)) / 100) * bounds.width);
    });
  </script>
</body>
</html>
