<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batch File Renamer</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#2f6fed;--acx:#fff;--bad:#c62828;--ok:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#ececE8;--mu:#9a9a94;--bd:#3a3a36;--ac:#6b9bff;--acx:#101010;--bad:#ef6a6a;--ok:#6fcf74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#ececE8;--mu:#9a9a94;--bd:#3a3a36;--ac:#6b9bff;--acx:#101010;--bad:#ef6a6a;--ok:#6fcf74;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;color:var(--ac);font-size:13px;font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu);flex:1 1 140px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input[type=checkbox]{width:auto}
button{cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--tx);flex:0 0 auto}
.note{font-size:13px;color:var(--mu)}
.tw{overflow-x:auto;max-height:420px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mu);font-weight:600}
td.new{font-weight:600}
.bad{color:var(--bad)}.ok{color:var(--ok)}
#msg{min-height:22px;margin-top:10px}
</style>
</head>
<body>
<main>
<a class="back" href="./" aria-label="Back to Tool Hub"><span aria-hidden="true">←</span> Back to Tool Hub</a>
<h1>Batch File Renamer</h1>
<p class="sub">Pick a folder, choose an extension, define a pattern, preview, apply. Everything runs in your browser; no files are uploaded.</p>

<div class="card">
  <div class="row" style="align-items:end">
    <button class="p" id="pick">Choose folder…</button>
    <label style="flex:2 1 220px">Extension to rename<select id="ext" disabled></select></label>
    <label>Sort by<select id="sort">
      <option value="name">Name (natural)</option>
      <option value="date">Modified date</option>
      <option value="size">Size</option>
    </select></label>
  </div>
  <p class="note" id="mode" style="margin:10px 0 0"></p>
</div>

<div class="card">
  <div class="row">
    <label style="flex:2 1 220px">Pattern <span>({n} = serial number, {name} = original name; if {n} is missing, a serial is added automatically)</span><input id="tpl" value="chapter-{n}"></label>
    <label>Start at<input id="start" type="number" value="1"></label>
    <label>Step<input id="step" type="number" value="1" min="1"></label>
    <label>Zero-pad to<input id="pad" type="number" value="0" min="0" max="10"></label>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="chk"><input type="checkbox" id="lc" checked> Lowercase extension</label>
    <label class="chk"><input type="checkbox" id="rev"> Reverse order</label>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;align-items:center">
    <strong id="count">No folder loaded</strong>
    <div class="row">
      <button class="p" id="apply" disabled>Rename in folder</button>
      <button id="zip" disabled>Download as ZIP</button>
    </div>
  </div>
  <div class="tw" style="margin-top:10px"><table>
    <thead><tr><th>#</th><th>Current name</th><th>New name</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="msg" class="note"></div>
</div>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const hasFS=typeof window.showDirectoryPicker==='function';
let dir=null, files=[], plan=[];
const coll=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});

$('mode').textContent=hasFS
  ?'Your browser supports direct renaming in the folder. If it is blocked (e.g. embedded frame), the ZIP download still works.'
  :'This browser cannot rename in place, so use "Download as ZIP" to get the renamed files.';
$('apply').title=hasFS?'':'Not supported in this browser';

function msg(t,c){const m=$('msg');m.textContent=t;m.className='note '+(c||'')}
function split(n){const i=n.lastIndexOf('.');return i>0?[n.slice(0,i),n.slice(i)]:[n,'']}

async function load(list,dirHandle){
  dir=dirHandle||null;
  files=list.map(o=>{const [b,e]=split(o.file.name);return {...o,name:o.file.name,base:b,ext:e}});
  const counts={};files.forEach(f=>{const k=f.ext.toLowerCase();counts[k]=(counts[k]||0)+1});
  const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const sel=$('ext');sel.innerHTML='';
  keys.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=(k||'(no extension)')+'  —  '+counts[k]+' files';sel.appendChild(o)});
  sel.disabled=!keys.length;
  msg(keys.length?'':'No files found in the top level of that folder.');
  render();
}

$('pick').onclick=async()=>{
  if(hasFS){
    try{
      const d=await window.showDirectoryPicker({mode:'readwrite'});
      const list=[];
      for await(const h of d.values()){if(h.kind==='file')list.push({handle:h,file:await h.getFile()})}
      await load(list,d);return;
    }catch(e){
      if(e.name==='AbortError')return;
      msg('Direct folder access unavailable here ('+e.name+'); using the fallback picker.');
    }
  }
  const inp=document.createElement('input');
  inp.type='file';inp.webkitdirectory=true;inp.multiple=true;
  inp.onchange=()=>{
    const list=[...inp.files].filter(f=>(f.webkitRelativePath.match(/\//g)||[]).length<=1).map(f=>({file:f}));
    load(list,null);
  };
  inp.click();
};

function render(){
  const ext=$('ext').value;
  let sel=files.filter(f=>f.ext.toLowerCase()===ext);
  const s=$('sort').value;
  sel.sort((a,b)=>s==='date'?a.file.lastModified-b.file.lastModified:s==='size'?a.file.size-b.file.size:coll.compare(a.name,b.name));
  if($('rev').checked)sel.reverse();
  let tpl=$('tpl').value||'{n}';if(!/\{n\}/.test(tpl))tpl+='-{n}';const start=parseInt($('start').value)||0,step=parseInt($('step').value)||1,pad=Math.max(0,parseInt($('pad').value)||0);
  plan=sel.map((f,i)=>{
    const n=String(start+i*step).padStart(pad,'0');
    const nn=tpl.replace(/\{n\}/g,n).replace(/\{name\}/g,f.base)+($('lc').checked?f.ext.toLowerCase():f.ext);
    return {f,newName:nn};
  });
  const selSet=new Set(sel.map(f=>f.name));
  const others=new Set(files.filter(f=>!selSet.has(f.name)).map(f=>f.name.toLowerCase()));
  const seen={};plan.forEach(p=>{const k=p.newName.toLowerCase();seen[k]=(seen[k]||0)+1});
  plan.forEach(p=>{
    p.err=/[\\\/:*?"<>|]/.test(p.newName)?'invalid characters':seen[p.newName.toLowerCase()]>1?'duplicate name':others.has(p.newName.toLowerCase())?'exists in folder':'';
  });
  const tb=$('rows');tb.innerHTML='';
  plan.forEach((p,i)=>{
    const tr=document.createElement('tr');
    const c=(t,cls)=>{const td=document.createElement('td');td.textContent=t;if(cls)td.className=cls;tr.appendChild(td);return td};
    c(i+1);c(p.f.name);
    c(p.newName+(p.err?'  ⚠ '+p.err:''),'new '+(p.err?'bad':p.newName===p.f.name?'':'ok'));
    tb.appendChild(tr);
  });
  const bad=plan.filter(p=>p.err).length;
  $('count').textContent=files.length?plan.length+' files selected'+(bad?' · '+bad+' conflicts':''):'No folder loaded';
  const ready=plan.length>0&&!bad;
  $('apply').disabled=!ready||!dir;
  $('zip').disabled=!ready;
}
['ext','sort','tpl','start','step','pad','lc','rev'].forEach(id=>$(id).addEventListener('input',render));

$('apply').onclick=async()=>{
  const todo=plan.filter(p=>p.newName!==p.f.name);
  if(!todo.length){msg('Nothing to change.');return}
  if(!confirm('Rename '+todo.length+' files in the folder? This cannot be undone.'))return;
  $('apply').disabled=true;
  try{
    const canMove=todo[0].f.handle&&typeof todo[0].f.handle.move==='function';
    const oldNames=new Set(todo.map(p=>p.f.name));
    if(!canMove&&todo.some(p=>oldNames.has(p.newName))){
      throw new Error('Some new names equal existing names in this set, and this browser cannot rename safely in place. Use ZIP, or change the pattern.');
    }
    let done=0;
    if(canMove){
      const stamp='__tmp'+Date.now()+'_';
      for(const p of todo){await p.f.handle.move(stamp+done++)}
      done=0;
      for(const p of todo){await p.f.handle.move(p.newName);msg('Renamed '+(++done)+' / '+todo.length)}
    }else{
      for(const p of todo){
        const nh=await dir.getFileHandle(p.newName,{create:true});
        const w=await nh.createWritable();await w.write(await p.f.handle.getFile());await w.close();
        await dir.removeEntry(p.f.name);msg('Renamed '+(++done)+' / '+todo.length);
      }
    }
    msg('Done. '+todo.length+' files renamed.','ok');
    const list=[];for await(const h of dir.values()){if(h.kind==='file')list.push({handle:h,file:await h.getFile()})}
    const cur=$('ext').value;await load(list,dir);$('ext').value=cur;render();
  }catch(e){msg('Failed: '+e.message,'bad');render()}
};

/* Minimal store-only ZIP writer */
const T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){let c=~0;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(~c)>>>0}
async function makeZip(items){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate()),tm=(d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1);
  for(const it of items){
    const data=new Uint8Array(await it.file.arrayBuffer()),nm=enc.encode(it.name),c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
    h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);
    e.setUint16(12,tm,true);e.setUint16(14,dt,true);e.setUint32(16,c,true);e.setUint32(20,data.length,true);e.setUint32(24,data.length,true);
    e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cd.push(e.buffer,nm);
    off+=30+nm.length+data.length;
  }
  let cs=0;cd.forEach(x=>cs+=x.byteLength||x.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,items.length,true);end.setUint16(10,items.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:'application/zip'});
}
$('zip').onclick=async()=>{
  $('zip').disabled=true;msg('Building ZIP…');
  try{
    const blob=await makeZip(plan.map(p=>({name:p.newName,file:p.f.file})));
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='renamed-files.zip';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    msg('ZIP created ('+plan.length+' files).','ok');
  }catch(e){msg('ZIP failed: '+e.message,'bad')}
  render();
};
})();
</script>
</body>
</html>
